<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#536651"/></marker><pattern id="wood" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M3 0V16M8 0V16" stroke="#b59977" stroke-width="2"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#2b3c32} .title{font-size:36px;font-family:Georgia,serif}.sub{font-size:18px;fill:#687267}.label{font-size:21px}.small{font-size:17px;fill:#667363}.shape{fill:#e7ddcc;stroke:#806e58;stroke-width:3}.seat{fill:#eae2d4;stroke:#78836b;stroke-width:3}.dim{stroke:#536651;stroke-width:1.8;marker-start:url(#a);marker-end:url(#a)}.dash{stroke:#7b8973;stroke-width:2;stroke-dasharray:8 6;fill:none}</style><rect width="1200" height="800" fill="#faf7ef"/><text x="60" y="68" class="title">Sillón derecho · planta</text><text x="60" y="105" class="sub">Volumen ilustrativo. Estas dimensiones no son una medición del sillón real.</text><rect x="220" y="260" width="575" height="300" rx="18" class="seat"/><rect x="220" y="260" width="575" height="40" rx="0" class="shape"/><path d="M220 220L795 220" class="dim"/><text x="390" y="200" class="label">115 cm · propuesta</text><path d="M850 260L850 560" class="dim"/><text x="875" y="420" class="label">60 cm</text><text x="300" y="620" class="label">↓ El asiento mira hacia el exterior</text><text x="260" y="300" class="small">Respaldo junto al ventanal fijo</text><text x="220" y="670" class="small">43 cm asiento · 80 cm respaldo · mueble definitivo por medir</text><text x="60" y="739" class="small">Registro = medida aportada · Propuesta = dimensión de diseño</text><text x="60" y="769" class="small">Esquema conceptual. No certifica fabricación, paso útil, anclajes o ventilación.</text></svg>