<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#536651"/></marker><pattern id="wood" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M3 0V16M8 0V16" stroke="#b59977" stroke-width="2"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#2b3c32} .title{font-size:36px;font-family:Georgia,serif}.sub{font-size:18px;fill:#687267}.label{font-size:21px}.small{font-size:17px;fill:#667363}.shape{fill:#e7ddcc;stroke:#806e58;stroke-width:3}.seat{fill:#eae2d4;stroke:#78836b;stroke-width:3}.dim{stroke:#536651;stroke-width:1.8;marker-start:url(#a);marker-end:url(#a)}.dash{stroke:#7b8973;stroke-width:2;stroke-dasharray:8 6;fill:none}</style><rect width="1200" height="800" fill="#faf7ef"/><text x="60" y="68" class="title">Dos mesas · opción B</text><text x="60" y="105" class="sub">Tapas ampliadas: propuesta de 78 × 48 cm para cada ambiente.</text><rect x="155" y="310" width="390" height="240" rx="115" class="seat"/><rect x="655" y="310" width="390" height="240" rx="115" class="shape"/><path d="M155 250L545 250" class="dim"/><text x="280" y="228" class="label">78 cm</text><path d="M655 250L1045 250" class="dim"/><text x="785" y="228" class="label">78 cm</text><path d="M590 310L590 550" class="dim"/><text x="558" y="590" class="label">48 cm</text><text x="225" y="625" class="label">Mesa del sillón en L</text><text x="740" y="625" class="label">Mesa del paño fijo</text><text x="390" y="682" class="small">Ambas mesas: altura propuesta 43 cm</text><text x="60" y="739" class="small">Registro = medida aportada · Propuesta = dimensión de diseño</text><text x="60" y="769" class="small">Esquema conceptual. No certifica fabricación, paso útil, anclajes o ventilación.</text></svg>