<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#536651"/></marker><pattern id="wood" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M3 0V16M8 0V16" stroke="#b59977" stroke-width="2"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#2b3c32} .title{font-size:36px;font-family:Georgia,serif}.sub{font-size:18px;fill:#687267}.label{font-size:21px}.small{font-size:17px;fill:#667363}.shape{fill:#e7ddcc;stroke:#806e58;stroke-width:3}.seat{fill:#eae2d4;stroke:#78836b;stroke-width:3}.dim{stroke:#536651;stroke-width:1.8;marker-start:url(#a);marker-end:url(#a)}.dash{stroke:#7b8973;stroke-width:2;stroke-dasharray:8 6;fill:none}</style><rect width="1200" height="800" fill="#faf7ef"/><text x="60" y="68" class="title">Pared izquierda</text><text x="60" y="105" class="sub">El panel cubre todo el tramo de 146 cm; no absorbe el sacado.</text><rect x="300" y="185" width="365" height="450" rx="0" class="shape"/><rect x="300" y="185" width="365" height="450" fill="url(#wood)"/><rect x="257" y="185" width="43" height="450" rx="0" class="shape"/><path d="M300 150L665 150" class="dim"/><text x="430" y="136" class="label">146 cm</text><path d="M720 185L720 635" class="dim"/><text x="740" y="415" class="label">225 cm</text><text x="825" y="265" class="label">Panel principal</text><text x="825" y="300" class="small">Pared plana</text><text x="825" y="370" class="label">Sacado separado</text><text x="825" y="405" class="small">17 cm de tramo</text><text x="825" y="440" class="small">Forma y eje por medir</text><text x="300" y="681" class="small">146 + 17 = 163 cm; la profundidad registrada sigue siendo 164 cm.</text><text x="60" y="739" class="small">Registro = medida aportada · Propuesta = dimensión de diseño</text><text x="60" y="769" class="small">Esquema conceptual. No certifica fabricación, paso útil, anclajes o ventilación.</text></svg>