<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#536651"/></marker><pattern id="wood" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M3 0V16M8 0V16" stroke="#b59977" stroke-width="2"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#2b3c32} .title{font-size:36px;font-family:Georgia,serif}.sub{font-size:18px;fill:#687267}.label{font-size:21px}.small{font-size:17px;fill:#667363}.shape{fill:#e7ddcc;stroke:#806e58;stroke-width:3}.seat{fill:#eae2d4;stroke:#78836b;stroke-width:3}.dim{stroke:#536651;stroke-width:1.8;marker-start:url(#a);marker-end:url(#a)}.dash{stroke:#7b8973;stroke-width:2;stroke-dasharray:8 6;fill:none}</style><rect width="1200" height="800" fill="#faf7ef"/><text x="60" y="68" class="title">Mesa central · opción A</text><text x="60" y="105" class="sub">Diámetro y altura propuestos; no corresponden a un modelo de catálogo.</text><circle cx="460" cy="420" r="163" class="shape"/><rect x="175" y="335" width="135" height="155" rx="30" class="seat"/><rect x="630" y="335" width="135" height="155" rx="30" class="seat"/><path d="M297 205L623 205" class="dim"/><text x="350" y="185" class="label">Ø 65 cm · propuesta</text><text x="875" y="330" class="label">Mesa: 74 cm alta</text><text x="875" y="385" class="label">Dos sillas</text><text x="875" y="425" class="small">Perfil ilustrativo</text><text x="875" y="470" class="small">Revisar retiro de silla</text><text x="340" y="642" class="small">La ubicación final debe comprobarse en la terraza.</text><text x="60" y="739" class="small">Registro = medida aportada · Propuesta = dimensión de diseño</text><text x="60" y="769" class="small">Esquema conceptual. No certifica fabricación, paso útil, anclajes o ventilación.</text></svg>