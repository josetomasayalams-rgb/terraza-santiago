l">Patas propias sobre el piso</text><text x="60" y="739" class="small">Registro = medida aportada · Propuesta = dimensión de diseño</text><text x="60" y="769" class="small">Esquema conceptual. No certifica fabricación, paso útil, anclajes o ventilación.</text></svg>